name: release

# Publishing is deliberately gated on a tag rather than a push to main: a
# version on PyPI can never be replaced or reused, so it should take an explicit
# act, not a merge.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # The packaging bug that shipped was contracts/ missing from the wheel, so
      # the release path asserts it is there rather than trusting the config.
      - name: wheel must carry contracts/
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ["memory_agent/contracts/db/schema.sql",
                  "memory_agent/contracts/mcp-tools.json"]
          missing = [n for n in need if n not in names]
          sys.exit(f"wheel is missing {missing} - it cannot start") if missing else print("contracts present")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no API token to store, leak, or rotate. Configure it once at
    # https://pypi.org/manage/project/memory-champ/settings/publishing/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
